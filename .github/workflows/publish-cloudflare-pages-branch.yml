name: Publish HTML (Cloudflare Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quarto and Python deps
        run: |
          pip install -r requirements.txt &
          PIP_PID=$!

          QUARTO_VER=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\(.*\)".*/\1/')
          curl -sLo /tmp/quarto.deb \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VER}/quarto-${QUARTO_VER}-linux-amd64.deb"
          sudo dpkg -i /tmp/quarto.deb

          wait $PIP_PID

      - name: Run simulations
        run: python analysis/run_all.py

      - name: Stamp build info and render
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          echo "**Version:** ${SHORT_SHA} ([commit](${COMMIT_URL}))" > _build-info.md

          LISBON_TIME=$(TZ='Europe/Lisbon' date '+%Y-%m-%dT%H:%M:%S')
          sed -i "s|^date-modified:.*|date-modified: ${LISBON_TIME}|" paper.qmd

          quarto render --to html

      - name: Deploy to Cloudflare Pages
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          npx wrangler pages deploy outputs/ \
            --project-name=manuscript-decentralized-curation \
            --branch="$BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
