name: Publish HTML (Cloudflare Pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install evaluation dependencies
        run: python -m pip install -r "requirements.txt"

      - name: Run simulations (E1–E3)
        run: python "analysis/run_all.py"

      - name: Stamp build info and date-modified
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="https://github.com/proveuswrong/manuscript-decentralized-curation/commit/${GITHUB_SHA}"
          echo "**Version:** ${SHORT_SHA} ([commit](${COMMIT_URL}))" > "_build-info.md"

          # Stamp date-modified in paper.qmd with Lisbon time (WET/WEST)
          LISBON_TIME=$(TZ='Europe/Lisbon' date '+%B %-d, %Y at %H:%M %Z')
          sed -i "s|^date-modified:.*|date-modified: \"${LISBON_TIME}\"|" paper.qmd

      - name: Render HTML
        run: quarto render --to html

      - name: Stage publish content
        run: |
          mkdir -p /tmp/cf-public
          cp "outputs/paper.html" "/tmp/cf-public/index.html"

      - name: Restore working tree for branch switch
        run: git restore "_build-info.md" "paper.qmd"

      - name: Publish to cf-pages branch
        run: |
          git fetch origin cf-pages:cf-pages || true

          if git show-ref --verify --quiet refs/heads/cf-pages; then
            git checkout cf-pages
          else
            git checkout --orphan cf-pages
          fi

          git rm -rf . || true
          git clean -fdx || true

          mkdir -p public
          cp "/tmp/cf-public/index.html" "public/index.html"

          git add public/index.html

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "chore(publish): update site"
          git push origin cf-pages

