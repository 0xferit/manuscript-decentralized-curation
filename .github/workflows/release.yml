name: Manuscript release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      tagged: ${{ steps.plan.outputs.tagged }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_version.py

  render-pdf:
    needs: plan
    if: needs.plan.outputs.tag != '' && needs.plan.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          tinytex: "true"

      - name: Render PDF
        run: |
          printf '**Version:** %s\n' "$RELEASE_TAG" > _build-info.md
          make render-pdf QUARTO_PDF_FLAGS="-M latex-auto-install:false"
          python3 .github/scripts/publish_to_zenodo.py --write-manifest

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.tag }}
          path: |
            outputs/paper.pdf
            outputs/manifest.json
          if-no-files-found: error

  create-release:
    needs: [plan, render-pdf]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.plan.outputs.tag }}
          path: outputs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" outputs/paper.pdf outputs/manifest.json
          --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --latest

  zenodo:
    needs: [plan, create-release]
    if: >-
      always() && github.event_name == 'push' && needs.plan.outputs.tag != ''
      && (needs.create-release.result == 'success' || needs.plan.outputs.tagged == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/publish-zenodo.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
