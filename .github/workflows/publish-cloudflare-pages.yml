name: Site build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Check repo invariants
        run: make check-invariants

      - name: Cache simulation outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sim-cache
        with:
          path: |
            analysis/out
            analysis/fig
          key: sims-${{ hashFiles('analysis/run_all.py', 'requirements.txt', 'paper.qmd', 'projects/truth-post/blueprint.md') }}

      - name: Run simulations
        run: make analysis

      - name: Stamp build info and render
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          echo "**Version:** ${SHORT_SHA} ([commit](${COMMIT_URL}))" > _build-info.md

          LISBON_TIME=$(TZ='Europe/Lisbon' date '+%Y-%m-%dT%H:%M:%S')
          quarto render --to html -M "date-modified:${LISBON_TIME}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: abfb18f38d5263b5da582e40ba6ae552
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy outputs --project-name=manuscript-decentralized-curation --branch=${{ github.head_ref || github.ref_name }}
