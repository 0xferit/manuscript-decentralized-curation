name: Publish HTML (Cloudflare Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Cache simulation outputs
        uses: actions/cache@v5
        id: sim-cache
        with:
          path: |
            analysis/out
            analysis/fig
          key: sims-${{ hashFiles('analysis/run_all.py', 'requirements.txt') }}

      - name: Run simulations
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: python analysis/run_all.py

      - name: Stamp build info and render
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          echo "**Version:** ${SHORT_SHA} ([commit](${COMMIT_URL}))" > _build-info.md

          LISBON_TIME=$(TZ='Europe/Lisbon' date '+%Y-%m-%dT%H:%M:%S')
          sed -i "s|^date-modified:.*|date-modified: ${LISBON_TIME}|" paper.qmd
          sed -i "s|^date-modified:.*|date-modified: ${LISBON_TIME}|" rpgf/design/index.qmd
          sed -i "s|^date-modified:.*|date-modified: ${LISBON_TIME}|" truth-post/blueprint/index.qmd

          quarto render --to html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: abfb18f38d5263b5da582e40ba6ae552
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy outputs --project-name=manuscript-decentralized-curation --branch=${{ github.head_ref || github.ref_name }}
