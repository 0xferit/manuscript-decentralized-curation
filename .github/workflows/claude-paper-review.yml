name: Claude Paper Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - paper.qmd
      - references.bib
      - 'projects/**'
      - '.claude/skills/paper-*/**'
      - .claude/settings.json
      - .github/claude-review-settings.json
      - .github/workflows/claude-paper-review.yml
      - .github/scripts/install_review_skills.py
      - .github/scripts/remote_credentials.py
      - .github/scripts/review_fetch_domains.py
      - .github/scripts/summarize_claude_run.py
      - scripts/test_install_review_skills.py
      - scripts/test_remote_credentials.py
      - scripts/test_review_fetch_domains.py

concurrency:
  group: claude-paper-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-paper-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test the review helpers
        run: python3 -m unittest scripts/test_install_review_skills.py scripts/test_review_fetch_domains.py scripts/test_remote_credentials.py

      - name: Install the review skills without tool grants
        env:
          K_DENSE_REPOSITORY: https://github.com/K-Dense-AI/scientific-agent-skills.git
          K_DENSE_COMMIT: 45af7aefb40e0ef12fda62c6f01d1067ea1e1222 # v2.69.0
          K_DENSE_SKILLS: peer-review scientific-critical-thinking citation-management
        run: |
          read -ra skills <<< "$K_DENSE_SKILLS"
          k_dense="$RUNNER_TEMP/k-dense"
          git init --quiet "$k_dense"
          git -C "$k_dense" remote add origin "$K_DENSE_REPOSITORY"
          git -C "$k_dense" sparse-checkout set --cone "${skills[@]/#/skills/}"
          git -C "$k_dense" fetch --quiet --depth 1 --filter=blob:none origin "$K_DENSE_COMMIT"
          git -C "$k_dense" checkout --quiet FETCH_HEAD
          python3 .github/scripts/install_review_skills.py "$HOME/.claude/skills" \
            --license "$k_dense/LICENSE.md" "${skills[@]/#/$k_dense/skills/}"
          python3 .github/scripts/install_review_skills.py "$HOME/.claude/skills" .claude/skills/paper-*

      - name: Derive the fetch allowlist
        id: fetch-rules
        run: |
          rules=$(python3 .github/scripts/review_fetch_domains.py)
          echo "rules=$rules" >> "$GITHUB_OUTPUT"

      - name: Run Claude Paper Review
        id: review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: 'Copilot'
          prompt: '/paper-pr-review ${{ github.event.pull_request.number }} --comment'
          settings: .github/claude-review-settings.json
          claude_args: '--model best --setting-sources user --disallowedTools Skill --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),WebSearch,Read(~/.claude/skills/**),${{ steps.fetch-rules.outputs.rules }}"'

      - name: Record the review outcome in the job summary
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: python3 .github/scripts/summarize_claude_run.py "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the git remote still carries credentials
        if: always()
        run: python3 .github/scripts/remote_credentials.py check
