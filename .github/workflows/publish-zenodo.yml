name: Publish PDF to Zenodo

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: zenodo-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Download reviewed release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --pattern paper.pdf --pattern manifest.json --dir outputs

      - name: Verify release binding and publication checks
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -m unittest discover -s scripts -p test_zenodo_release.py
          python3 .github/scripts/publish_to_zenodo.py --verify-only

      - name: Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: python3 .github/scripts/publish_to_zenodo.py
