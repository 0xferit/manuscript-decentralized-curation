sonar.organization=0xferit
sonar.projectKey=0xferit_manuscript-decentralized-curation_rpgf-prototype
sonar.projectName=RPGF Prototype
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.exclusions=node_modules/**,dist/**,coverage/**,.vite/**,screenshots/**

sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# Triaged "Won't fix" suppressions. Each entry justified inline.

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# e1: trailing zeros (`0.20`, `0.10`) are deliberate column alignment in
# the seeded curator table for at-a-glance review.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7748
sonar.issue.ignore.multicriteria.e1.resourceKey=src/engine/bootstrap/curators.ts

# e2: parallel-array iteration with index `i` reads weights[i]/values[i]
# in lockstep; `for-of` cannot express this without an extra zip helper.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.e2.resourceKey=src/engine/curation/stats.ts

# e3: each `events.push(...)` is co-located with its conditional logic
# in the DDR-resolution branches; merging into one push hurts readability.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S7778
sonar.issue.ignore.multicriteria.e3.resourceKey=src/engine/lifecycle/phases/holdback.ts

# e4: append-only lists (event log, reputation history) use array index
# as React key. Index is stable since entries are never reordered.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e4.resourceKey=src/inspector/panels/*.tsx

# e5: `bad-falsifiable`, `bad-template` CSS class names naturally read as
# negations of `falsifiable`/`templateOk`. Flipping the ternary inverts
# the semantic mapping.
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S7735
sonar.issue.ignore.multicriteria.e5.resourceKey=src/inspector/panels/NominationsPanel.tsx
