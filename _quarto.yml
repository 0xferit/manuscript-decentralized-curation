project:
  type: default
  output-dir: outputs
  render:
    - "paper.qmd"
    - "truth-post/index.qmd"
    - "truth-post/blueprint/index.qmd"
    - "rpgf/index.qmd"
    - "rpgf/design/index.qmd"

date-format: "MMMM D, YYYY [at] HH:mm"

format:
  html:
    output-file: index
    embed-resources: true
    theme: default
    # To use the PUW theme: theme: [default, themes/puw.scss]
    page-layout: article
    grid:
      body-width: 820px
      margin-width: 300px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    number-sections: true
    anchor-sections: true
    html-math-method: katex
  pdf:
    output-file: paper
    toc: true
    toc-depth: 3
    number-sections: true

bibliography: references.bib
