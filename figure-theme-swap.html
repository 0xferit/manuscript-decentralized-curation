<script>
(() => {
  const FIGURE_PATH = /(?:^|\/)(analysis\/fig|diagrams)\/[^?#]+\.(png|svg)$/i;

  const variantSrc = (src, theme) => {
    if (!src || src.startsWith("data:")) {
      return src;
    }
    const [path, query = ""] = src.split("?");
    const match = path.match(/^(.*?)(-dark)?(\.[^.]+)$/);
    if (!match) {
      return src;
    }
    const [, base, , ext] = match;
    const themedPath = theme === "dark" ? `${base}-dark${ext}` : `${base}${ext}`;
    return query ? `${themedPath}?${query}` : themedPath;
  };

  const applyFigureTheme = () => {
    const dark = document.body.classList.contains("quarto-dark");
    const theme = dark ? "dark" : "light";

    document.querySelectorAll("img").forEach((img) => {
      const currentSrc = img.getAttribute("src");
      if (!currentSrc || currentSrc.startsWith("data:")) {
        return;
      }

      const parsed = new URL(currentSrc, window.location.href);
      if (!FIGURE_PATH.test(parsed.pathname)) {
        return;
      }

      const lightSrc = img.dataset.lightSrc || variantSrc(currentSrc, "light");
      const darkSrc = img.dataset.darkSrc || variantSrc(lightSrc, "dark");
      const desiredSrc = theme === "dark" ? darkSrc : lightSrc;

      img.dataset.lightSrc = lightSrc;
      img.dataset.darkSrc = darkSrc;

      if (img.getAttribute("src") !== desiredSrc) {
        img.setAttribute("src", desiredSrc);
      }
    });
  };

  const onReady = () => {
    const refresh = () => {
      applyFigureTheme();
    };

    refresh();
    new MutationObserver(refresh).observe(document.body, {
      attributes: true,
      attributeFilter: ["class"],
      childList: true,
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", onReady, { once: true });
  } else {
    onReady();
  }
})();
</script>
